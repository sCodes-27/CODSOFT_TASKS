
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBloom - My Blog</title>
    <link rel="stylesheet" href="Blog.css">
</head>
<body>

    <header>
        <h2 class="logo">MindBloom 🌿</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#moods">Explore</a>
            <a href="#blogs">Blogs</a>
        </nav>

        <button id="darkBtn">🌙</button>
    </header>

    <section class="hero" id="home">
        <h1>A little space for your mind.</h1>
        <p>Read something that matches how you feel today.</p>
        <a href="#moods" class="btn">Explore Stories</a>
    </section>

    <section class="moods" id="moods">
        <h2>How are you feeling today?</h2>

        <div class="mood-buttons">
            <button onclick="showMood('calm')">🌿 Calm</button>
            <button onclick="showMood('happy')">☀️ Happy</button>
            <button onclick="showMood('sad')">🌧️ Sad</button>
            <button onclick="showMood('motivated')">✨ Motivated</button>
        </div>

        <p id="moodMessage">Choose a mood to find a story!</p>
    </section>
  <script src="Blog.js"></script>
</body>
</html>
